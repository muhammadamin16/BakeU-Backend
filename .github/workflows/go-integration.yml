name: Go and Mongo integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.4
      - name: New disposable Mongo services
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name bakeu-ci-mongo --network host mongo:8.0 mongod --replSet rs0 --bind_ip 127.0.0.1
          docker run -d --name bakeu-ci-standalone --network host mongo:8.0 mongod --port 27018 --bind_ip 127.0.0.1
          for attempt in {1..60}; do
            if docker exec bakeu-ci-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec bakeu-ci-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in {1..60}; do
            if docker exec bakeu-ci-mongo mongosh --quiet --eval 'if(!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Unit, integration and race tests
        env:
          BAKEU_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          BAKEU_TEST_STANDALONE_MONGO_URI: mongodb://127.0.0.1:27018/?directConnection=true
        run: |
          go test -count=1 -race ./...
          go vet ./...
          go build ./cmd/server ./cmd/phone-email-index ./cmd/mongo-readiness
